<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRE AI Incident Responder</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 20px 40px; border-bottom: 2px solid #334155; }
        .header h1 { color: #38bdf8; font-size: 24px; }
        .header p { color: #94a3b8; font-size: 14px; }
        .container { padding: 30px 40px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; }
        .card h3 { color: #94a3b8; font-size: 13px; margin-bottom: 10px; text-transform: uppercase; }
        .card .value { font-size: 32px; font-weight: bold; }
        .green { color: #22c55e; }
        .red { color: #ef4444; }
        .blue { color: #38bdf8; }
        .buttons { display: flex; gap: 15px; margin-bottom: 30px; }
        .btn { padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-green { background: #22c55e; color: white; }
        .btn-red { background: #ef4444; color: white; }
        .btn-blue { background: #38bdf8; color: #0f172a; }
        .btn:hover { opacity: 0.85; }
        .panel { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; margin-bottom: 20px; }
        .panel h2 { color: #38bdf8; margin-bottom: 15px; font-size: 16px; }
        .ai-response { background: #0f172a; border-radius: 8px; padding: 15px; color: #a3e635; font-family: monospace; font-size: 13px; min-height: 80px; white-space: pre-wrap; }
        .log-item { padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; font-family: monospace; }
        .log-info { background: #1e3a5f; color: #93c5fd; }
        .log-error { background: #3f1515; color: #fca5a5; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .dot-green { background: #22c55e; }
        .dot-red { background: #ef4444; }
        .loading { color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 SRE AI Incident Responder</h1>
        <p>Real-time monitoring and AI-powered incident diagnosis</p>
    </div>

    <div class="container">
        <!-- Status Cards -->
        <div class="grid">
            <div class="card">
                <h3>System Status</h3>
                <div class="value green" id="status">🟢 Healthy</div>
            </div>
            <div class="card">
                <h3>Pods Running</h3>
                <div class="value blue" id="pods">2 / 2</div>
            </div>
            <div class="card">
                <h3>Total Requests</h3>
                <div class="value blue" id="requests">0</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="buttons">
            <button class="btn btn-green" onclick="checkHealth()">✅ Check Health</button>
            <button class="btn btn-red" onclick="simulateError()">🔥 Simulate Incident</button>
            <button class="btn btn-blue" onclick="analyzeWithAI()">🤖 Analyze with AI</button>
        </div>

        <!-- AI Analysis Panel -->
        <div class="panel">
            <h2>🤖 AI Incident Analysis</h2>
            <div class="ai-response" id="ai-output">
Click "Analyze with AI" to diagnose current system state...
            </div>
        </div>

        <!-- Live Logs Panel -->
        <div class="panel">
            <h2>📋 Live Activity Log</h2>
            <div id="logs">
                <div class="log-item log-info">
                    [INFO] SRE AI Incident Responder started
                </div>
            </div>
        </div>
    </div>

    <script>
        let requestCount = 0;
        let errorCount = 0;

        function addLog(message, type) {
            const logs = document.getElementById('logs');
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = `log-item ${type === 'error' ? 'log-error' : 'log-info'}`;
            div.textContent = `[${time}] ${message}`;
            logs.insertBefore(div, logs.firstChild);
        }

        async function checkHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                requestCount++;
                document.getElementById('requests').textContent = requestCount;
                document.getElementById('status').innerHTML = '🟢 Healthy';
                document.getElementById('status').className = 'value green';
                addLog('Health check passed — system is healthy', 'info');
            } catch(e) {
                addLog('Health check failed!', 'error');
            }
        }

        async function simulateError() {
            try {
                const res = await fetch('/simulate-error');
                const data = await res.json();
                requestCount++;
                document.getElementById('requests').textContent = requestCount;
                if (res.status === 500) {
                    errorCount++;
                    document.getElementById('status').innerHTML = '🔴 Incident Detected';
                    document.getElementById('status').className = 'value red';
                    addLog(`ERROR: Simulated 500 error detected! Total errors: ${errorCount}`, 'error');
                } else {
                    addLog('Simulated request — no error this time', 'info');
                }
            } catch(e) {
                addLog('Request failed!', 'error');
            }
        }

        async function analyzeWithAI() {
            const output = document.getElementById('ai-output');
            output.textContent = 'Analyzing system state...';
            
            const analysis = `AI INCIDENT ANALYSIS
═══════════════════════════════════
Timestamp:     ${new Date().toISOString()}
Total Requests: ${requestCount}
Error Count:   ${errorCount}
Error Rate:    ${requestCount > 0 ? ((errorCount/requestCount)*100).toFixed(1) : 0}%

DIAGNOSIS:
${errorCount === 0 ? 
'✅ System healthy. No incidents detected.' : 
`⚠️  ${errorCount} errors detected on /simulate-error endpoint.
   
ROOT CAUSE: Random 500 errors from simulate-error endpoint.
   
RECOMMENDED ACTIONS:
1. Check pod logs: kubectl logs <pod-name>
2. Check error rate in Grafana dashboard
3. Review recent deployments
4. Consider rolling back if error rate > 10%`}

KUBERNETES STATUS:
Pods:     2/2 Running
Service:  NodePort active
HPA:      Monitoring CPU usage`;

            output.textContent = analysis;
            addLog('AI analysis completed', 'info');
        }
    </script>
</body>
</html>
